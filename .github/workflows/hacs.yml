name: HACS Action
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify distribution is current
        run: cmp --silent room-card.js dist/room-card.js

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: plugin
