name: Validate
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and validate HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development metadata
        run: npm ci --ignore-scripts

      - name: Build distribution
        run: npm run build

      - name: Verify committed distribution
        run: git diff --exit-code -- dist/room-card.js

      - name: Run checks
        run: npm run check

      - name: HACS Action
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, reviewed 2026-08-20
        with:
          category: plugin
