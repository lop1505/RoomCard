name: HACS Action
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check dist/room-card.js
        
      - name: Check JavaScript syntax
        run: node --check room-card.js

      - name: Test render snapshot invalidation
        run: node scripts/test-render-signatures.mjs

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: plugin
